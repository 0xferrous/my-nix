name: bb Android APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        package:
          - bb-android-x86_64
          - bb-android-arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # The repo's own Cachix cache, see docs/repository-structure.md.
      - name: Enable binary cache
        uses: cachix/cachix-action@v15
        with:
          name: 0xferrous
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Fork pull requests never receive the token, and their build results
          # must not enter a cache that this repo's machines substitute from.
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          # Only build outputs and their runtime deps are worth quota: the
          # downloaded release artifacts below are recoverable from their
          # canonical URLs, and one 500 MB .deb is a tenth of the free 5 GB
          # cache. cache.nixos.org paths are skipped server-side already.
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$|\\.deb$|\\.rpm$|\\.AppImage$|\\.tar\\.(gz|xz|zst|bz2)$|\\.tgz$|\\.zip$|\\.whl$|^msb-|^libkrunfw-|^librusty_v8)"

      - name: Build APK
        run: nix build ".#${{ matrix.package }}" --out-link result

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp result/*.apk "artifacts/${{ matrix.package }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: artifacts/${{ matrix.package }}.apk
          if-no-files-found: error
          compression-level: 0
