name: bb Android APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        package:
          - bb-android-x86_64
          - bb-android-arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build APK
        run: nix build ".#${{ matrix.package }}" --out-link result

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp result/*.apk "artifacts/${{ matrix.package }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: artifacts/${{ matrix.package }}.apk
          if-no-files-found: error
          compression-level: 0
