name: update packages

# Refresh package versions through each package's `passthru.updateScript` and
# land the ones that build straight on `main`, so a routine bump needs no review
# click. Each bumped package is built first, so a release that no longer builds
# (patched binaries, moved assets, new dependencies) never reaches `main`
# unverified. A failed build is handed to a coding agent
# (.github/scripts/build-or-autofix.sh) that tries to repair the package
# expression and rebuild; only a bump that builds after the repair is pushed.
#
# Anything that cannot land directly falls back to a pull request on the stable
# `update/<package>` branch: a bump the agent could not repair (opened as a
# draft titled `[needs-human]`), a rebase on a `main` that moved while the leg
# was building, or a rejected push. The branch name is stable, so a package that
# gets a new release before its pull request is merged just updates the existing
# PR instead of opening another one, and landing on `main` closes that PR.
#
# Requires "Allow GitHub Actions to create and approve pull requests" in
# Settings -> Actions -> General -> Workflow permissions, and a `main` that
# accepts the bot's push (no required reviews, no "restrict pushes" rule). A
# rejected push is not fatal: it falls back to the pull request path.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      package:
        description: "Package attribute to update (empty updates every package)"
        required: false
        type: string
      autofix-attempts:
        description: "Repair attempts after a failed build (0 disables the agent)"
        required: false
        default: "3"
        type: string

permissions:
  contents: write
  pull-requests: write
  # Dispatching the build check on the new branch.
  actions: write

env:
  # The flake's `nixConfig` substituters are ignored unless a command passes
  # `--accept-flake-config`, and pull request checkouts must never be allowed
  # to nominate their own cache and key. Set the useful ones explicitly so
  # llm-agents packages (codex, pi, opencode) substitute from numtide's cache
  # instead of being compiled from source on every build.
  NIX_CONFIG: |
    extra-substituters = https://nix-community.cachix.org https://numtide.cachix.org https://cache.numtide.com https://noctalia.cachix.org
    extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= numtide.cachix.org-1:2ps1kLBUWjxIneOy1Ik6cQjb41X0iXVXeHigGmycPPE= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

jobs:
  prepare:
    name: Prepare package matrix
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Build package matrix
        id: list
        env:
          REQUESTED: ${{ inputs.package }}
        run: |
          set -euo pipefail

          # Derive the matrix from packages that expose an update script.
          # Aliases (same meta.position, e.g. microsandbox/msb) collapse to
          # one entry so they do not race on the same files.
          # shellcheck disable=SC2016  # Nix interpolation, not shell expansion
          packages=$(nix eval --json .#packages.x86_64-linux --apply '
            pkgs:
            let
              candidates = builtins.filter
                (name: (pkgs.${name}.passthru.updateScript or null) != null)
                (builtins.attrNames pkgs);
              key = name:
                let pkg = pkgs.${name};
                in pkg.meta.position or (toString pkg.drvPath);
              entries = map (name: { inherit name; k = key name; }) candidates;
              dedup = acc: remaining:
                if remaining == [ ] then
                  acc
                else
                  let
                    entry = builtins.head remaining;
                    rest = builtins.tail remaining;
                  in
                  if builtins.any (existing: existing.k == entry.k) acc then
                    dedup acc rest
                  else
                    dedup (acc ++ [ entry ]) rest;
              names = map (entry: entry.name) (dedup [ ] entries);
            in
            builtins.sort (a: b: a < b) names
          ')

          if [ "$(jq 'length' <<<"$packages")" -eq 0 ]; then
            echo "no updatable packages found" >&2
            exit 1
          fi

          if [ -n "$REQUESTED" ]; then
            if ! jq -e --arg p "$REQUESTED" 'index($p)' <<<"$packages" >/dev/null; then
              echo "unknown updatable package: $REQUESTED" >&2
              echo "updatable packages: $(jq -r 'join(", ")' <<<"$packages")" >&2
              exit 1
            fi
            packages=$(jq -cn --arg p "$REQUESTED" '[$p]')
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  update:
    name: ${{ matrix.package }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    concurrency:
      group: update-package-${{ matrix.package }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # The repo's own Cachix cache, see docs/repository-structure.md.
      - name: Enable binary cache
        uses: cachix/cachix-action@v15
        with:
          name: 0xferrous
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Fork pull requests never receive the token, and their build results
          # must not enter a cache that this repo's machines substitute from.
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          # Only build outputs and their runtime deps are worth quota: the
          # downloaded release artifacts below are recoverable from their
          # canonical URLs, and one 500 MB .deb is a tenth of the free 5 GB
          # cache. cache.nixos.org paths are skipped server-side already.
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$|\\.deb$|\\.rpm$|\\.AppImage$|\\.tar\\.(gz|xz|zst|bz2)$|\\.tgz$|\\.zip$|\\.whl$|^msb-|^libkrunfw-|^librusty_v8)"

      - name: Set NIX_PATH
        # nix-update's --use-update-script runs the update script in a
        # `nix develop` shell built from `<nixpkgs>`; point that at this
        # flake's pinned nixpkgs instead of relying on channels.
        run: |
          nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')
          echo "NIX_PATH=nixpkgs=$nixpkgs" >> "$GITHUB_ENV"

      - name: Update ${{ matrix.package }}
        id: update
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          message_file="$RUNNER_TEMP/commit-message"
          body_file="$RUNNER_TEMP/pull-request-body"
          rm -f "$message_file" "$body_file"

          # The build is a separate step so a failure can be handed to the
          # repair agent; bumping the version and refreshing hashes happens
          # here, and only the version/asset part is trusted to nix-update.
          #
          # The bump itself can fail before there is anything to build, e.g.
          # when upstream pushes a tag but not the release assets yet. Report
          # that, drop the half-finished bump, and retry on the next run
          # instead of failing the job or opening a pull request with it.
          update_log="$RUNNER_TEMP/update-log"
          rm -f "$update_log"
          if ! nix shell --inputs-from . nixpkgs#nix-update -c \
                 nix-update --flake --use-update-script \
                 --write-commit-message "$message_file" "$PACKAGE" >"$update_log" 2>&1; then
            tail -n 40 "$update_log" | sed -e 's/^/  /'
            git checkout -- . >/dev/null 2>&1 || true
            git clean -fdq -- pkgs >/dev/null 2>&1 || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$PACKAGE could not be bumped; nothing to build, retrying next run"
            {
              echo "### \`$PACKAGE\`: bump failed, retrying next run"
              echo
              echo "nix-update could not finish, so nothing was proposed. The usual"
              echo "cause is an upstream tag without published release assets; the"
              echo "output above has the details."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git diff --quiet; then
            echo "$PACKAGE is already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          first_line=$(sed -n '1p' "$message_file")
          subject="chore($PACKAGE): update ${first_line#*: }"
          details=$(sed -n '2,$p' "$message_file")

          printf 'Automated update of package %s.\n\n%s\n' "$PACKAGE" "$details" > "$body_file"

          # Commit the bump here so the repair agent's changes are a second,
          # reviewable commit instead of being merged into it. nix-update leaves
          # its edits unstaged, so they have to be added explicitly.
          commit_message="$RUNNER_TEMP/commit-message-final"
          printf '%s\n\n%s\n' "$subject" "$details" > "$commit_message"
          git add -A -- pkgs
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -F "$commit_message"

          {
            echo "changed=true"
            echo "subject=$subject"
            echo "message<<EOF"
            printf '%s\n%s\n' "$subject" "$details"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install repair agent
        if: steps.update.outputs.changed == 'true'
        # Same pinned opencode this machine uses, from llm-agents.nix; it is a
        # cache hit through cache.numtide.com (see NIX_CONFIG above).
        run: |
          agent=$(nix build --no-link --print-out-paths --impure --expr \
            '(builtins.getFlake (toString ./.)).inputs.llm-agents.packages.${builtins.currentSystem}.opencode')
          echo "$agent/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.package }}
        id: build
        if: steps.update.outputs.changed == 'true'
        # A bump the agent cannot repair still opens a draft pull request for a
        # human, so this step must not abort the job.
        continue-on-error: true
        env:
          PACKAGE: ${{ matrix.package }}
          PR_BODY_FILE: ${{ runner.temp }}/pull-request-body
          AUTOFIX_ATTEMPTS: ${{ inputs.autofix-attempts || '3' }}
          AUTOFIX_MODEL: ${{ vars.AUTOFIX_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          # Provider credentials for the repair agent. The default model is
          # OpenCode Go's deepseek-v4.1-flash, which authenticates with
          # OPENCODE_API_KEY (OpenCode Console key); the other keys are there so
          # a different AUTOFIX_MODEL works without touching the workflow.
          # Without any of them the agent is skipped and a broken bump fails the
          # leg, as it did before.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: .github/scripts/build-or-autofix.sh "$PACKAGE"

      - name: Land ${{ matrix.package }} on main
        id: land
        if: steps.update.outputs.changed == 'true' && steps.build.outcome == 'success'
        env:
          PACKAGE: ${{ matrix.package }}
        # A bump that builds needs no review, so it goes straight to `main`.
        # Every path that cannot land cleanly leaves `landed` unset and falls
        # through to the pull request steps below, so no work is lost.
        run: |
          set -uo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          fall_back() {
            echo "::warning::$PACKAGE $1; opening a pull request instead"
            exit 0
          }

          for attempt in 1 2 3; do
            if ! git fetch --no-tags origin main; then
              echo "::warning::could not fetch main (attempt $attempt/3)"
              sleep $((attempt * 10))
              continue
            fi

            # Another matrix leg may have landed a bump while this leg built,
            # and a rebased `main` can change this package's derivation when it
            # brought in a shared helper or overlay edit.
            if ! git rebase origin/main >/dev/null 2>&1; then
              git rebase --abort >/dev/null 2>&1 || true
              fall_back "conflicts with main"
            fi

            # The store is warm from the build above, so this only builds when
            # the rebase actually affected the package.
            if ! nix build ".#$PACKAGE" --no-link --print-build-logs \
                   >"$RUNNER_TEMP/rebuild-log" 2>&1; then
              tail -n 40 "$RUNNER_TEMP/rebuild-log" | sed -e 's/^/  /'
              fall_back "does not build on the current main"
            fi

            if git push origin HEAD:main; then
              {
                echo "landed=true"
                echo "commit=$(git rev-parse --short HEAD)"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::warning::push to main rejected (attempt $attempt/3)"
            sleep $((attempt * 10))
          done

          fall_back "could not be pushed to main"

      - name: Close the pull request this bump superseded
        if: steps.land.outputs.landed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: update/${{ matrix.package }}
          COMMIT: ${{ steps.land.outputs.commit }}
        # An earlier run may have opened a pull request for this package; its
        # bump is on `main` now, so the branch and the pull request are stale.
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" \
                     --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "no open pull request for $BRANCH"
            exit 0
          fi
          gh pr close "$number" --repo "${{ github.repository }}" --delete-branch \
            --comment "Landed directly on \`main\` in $COMMIT; a bump that builds needs no review."

      - name: Create or update pull request
        id: pr
        if: steps.update.outputs.changed == 'true' && steps.land.outputs.landed != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: update/${{ matrix.package }}
          delete-branch: true
          add-paths: pkgs
          commit-message: ${{ steps.update.outputs.subject }}
          # The pull request is the fallback path now: the bump either does not
          # build, or it builds but could not be pushed to `main`. A bump the
          # agent healed opens ready for review; an unhealed one opens as a
          # draft that says so in the title, so it is visible in the PR list
          # without failing the run.
          title: ${{ steps.build.outcome == 'failure' && format('[needs-human] {0}', steps.update.outputs.subject) || steps.update.outputs.subject }}
          body-path: ${{ runner.temp }}/pull-request-body
          draft: ${{ steps.build.outcome == 'failure' }}

      - name: Mark repaired pull request ready
        if: steps.pr.outputs.pull-request-number != '' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A pull request created by an earlier run may still be a draft.
        run: gh pr ready "${{ steps.pr.outputs.pull-request-number }}" --repo "${{ github.repository }}" || true

      - name: Run the build check on the pull request
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: update/${{ matrix.package }}
        run: |
          set -euo pipefail
          # GitHub always holds the `pull_request` runs that GITHUB_TOKEN
          # itself raises in an approval queue, but `workflow_dispatch` is the
          # documented exception, so dispatch the check explicitly instead of
          # waiting for a click.
          if ! gh workflow run package-builds.yml \
                 --repo "${{ github.repository }}" --ref "$BRANCH"; then
            echo "::warning::could not dispatch the build check for $BRANCH"
          fi

      - name: Summarize outcome
        if: steps.update.outputs.changed == 'true'
        run: |
          if [ "${{ steps.land.outputs.landed }}" = true ]; then
            printf '**%s** landed on `main` as %s\n' "${{ matrix.package }}" \
              "${{ steps.land.outputs.commit }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.build.outcome }}" = failure ]; then
            printf '**%s** needs a human: the bump does not build and the repair agent gave up.\nThe draft pull request carries the build output.\n' \
              "${{ matrix.package }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.pr.outputs.pull-request-url }}" ]; then
            printf '**%s** could not land directly, pull request: %s\n' \
              "${{ matrix.package }}" \
              "${{ steps.pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
