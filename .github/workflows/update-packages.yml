name: update packages

# Refresh package versions through each package's `passthru.updateScript` and
# open one pull request per package. Each bumped package is built before its
# pull request is opened, so a release that no longer builds (patched binaries,
# moved assets, new dependencies) fails the matrix leg instead of landing on
# main unverified. The branch name is stable, so a package that gets a new
# release before its previous PR is merged just updates the existing PR instead
# of opening another one.
#
# Requires "Allow GitHub Actions to create and approve pull requests" in
# Settings -> Actions -> General -> Workflow permissions.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      package:
        description: "Package attribute to update (empty updates every package)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare package matrix
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Build package matrix
        id: list
        env:
          REQUESTED: ${{ inputs.package }}
        run: |
          set -euo pipefail

          # Derive the matrix from packages that expose an update script.
          # Aliases (same meta.position, e.g. microsandbox/msb) collapse to
          # one entry so they do not race on the same files.
          # shellcheck disable=SC2016  # Nix interpolation, not shell expansion
          packages=$(nix eval --json .#packages.x86_64-linux --apply '
            pkgs:
            let
              candidates = builtins.filter
                (name: (pkgs.${name}.passthru.updateScript or null) != null)
                (builtins.attrNames pkgs);
              key = name:
                let pkg = pkgs.${name};
                in pkg.meta.position or (toString pkg.drvPath);
              entries = map (name: { inherit name; k = key name; }) candidates;
              dedup = acc: remaining:
                if remaining == [ ] then
                  acc
                else
                  let
                    entry = builtins.head remaining;
                    rest = builtins.tail remaining;
                  in
                  if builtins.any (existing: existing.k == entry.k) acc then
                    dedup acc rest
                  else
                    dedup (acc ++ [ entry ]) rest;
              names = map (entry: entry.name) (dedup [ ] entries);
            in
            builtins.sort (a: b: a < b) names
          ')

          if [ "$(jq 'length' <<<"$packages")" -eq 0 ]; then
            echo "no updatable packages found" >&2
            exit 1
          fi

          if [ -n "$REQUESTED" ]; then
            if ! jq -e --arg p "$REQUESTED" 'index($p)' <<<"$packages" >/dev/null; then
              echo "unknown updatable package: $REQUESTED" >&2
              echo "updatable packages: $(jq -r 'join(", ")' <<<"$packages")" >&2
              exit 1
            fi
            packages=$(jq -cn --arg p "$REQUESTED" '[$p]')
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  update:
    name: ${{ matrix.package }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    concurrency:
      group: update-package-${{ matrix.package }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # The repo's own Cachix cache, see docs/repository-structure.md.
      - name: Enable binary cache
        uses: cachix/cachix-action@v15
        with:
          name: 0xferrous
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Fork pull requests never receive the token, and their build results
          # must not enter a cache that this repo's machines substitute from.
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"

      - name: Set NIX_PATH
        # nix-update's --use-update-script runs the update script in a
        # `nix develop` shell built from `<nixpkgs>`; point that at this
        # flake's pinned nixpkgs instead of relying on channels.
        run: |
          nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')
          echo "NIX_PATH=nixpkgs=$nixpkgs" >> "$GITHUB_ENV"

      - name: Update ${{ matrix.package }}
        id: update
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          message_file=/tmp/commit-message
          rm -f "$message_file"

          # --build makes nix-update run `nix build .#PACKAGE` after the update
          # script rewrites the version and hashes, so a bump that breaks the
          # build fails this step before "Create or update pull request" and
          # no unverified PR is opened. Without it only the source hashes are
          # refreshed, which just proves the release assets still exist.
          nix shell --inputs-from . nixpkgs#nix-update -c \
            nix-update --flake --use-update-script --build \
            --write-commit-message "$message_file" "$PACKAGE"

          if git diff --quiet; then
            echo "$PACKAGE is already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          first_line=$(sed -n '1p' "$message_file")
          subject="chore($PACKAGE): update ${first_line#*: }"
          details=$(sed -n '2,$p' "$message_file")

          {
            echo "changed=true"
            echo "subject=$subject"
            echo "message<<EOF"
            printf '%s\n%s\n' "$subject" "$details"
            echo "EOF"
            echo "body<<EOF"
            printf 'Automated update of package %s.\n\n%s\n' "$PACKAGE" "$details"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: update/${{ matrix.package }}
          delete-branch: true
          add-paths: pkgs
          commit-message: ${{ steps.update.outputs.message }}
          title: ${{ steps.update.outputs.subject }}
          body: ${{ steps.update.outputs.body }}
