name: update packages

# Refresh package versions through each package's `passthru.updateScript` and
# open one pull request per package. Each bumped package is built before its
# pull request is opened, so a release that no longer builds (patched binaries,
# moved assets, new dependencies) fails the matrix leg instead of landing on
# main unverified. A failed build is handed to a coding agent
# (.github/scripts/build-or-autofix.sh) that tries to repair the package
# expression and rebuild; the leg still fails, and no pull request is opened,
# if the repair does not take. The branch name is stable, so a package that
# gets a new release before its previous PR is merged just updates the
# existing PR instead of opening another one.
#
# Requires "Allow GitHub Actions to create and approve pull requests" in
# Settings -> Actions -> General -> Workflow permissions.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      package:
        description: "Package attribute to update (empty updates every package)"
        required: false
        type: string
      autofix-attempts:
        description: "Repair attempts after a failed build (0 disables the agent)"
        required: false
        default: "3"
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  # The flake's `nixConfig` substituters are ignored unless a command passes
  # `--accept-flake-config`, and pull request checkouts must never be allowed
  # to nominate their own cache and key. Set the useful ones explicitly so
  # llm-agents packages (codex, pi, opencode) substitute from numtide's cache
  # instead of being compiled from source on every build.
  NIX_CONFIG: |
    extra-substituters = https://nix-community.cachix.org https://numtide.cachix.org https://cache.numtide.com https://noctalia.cachix.org
    extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= numtide.cachix.org-1:2ps1kLBUWjxIneOy1Ik6cQjb41X0iXVXeHigGmycPPE= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

jobs:
  prepare:
    name: Prepare package matrix
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Build package matrix
        id: list
        env:
          REQUESTED: ${{ inputs.package }}
        run: |
          set -euo pipefail

          # Derive the matrix from packages that expose an update script.
          # Aliases (same meta.position, e.g. microsandbox/msb) collapse to
          # one entry so they do not race on the same files.
          # shellcheck disable=SC2016  # Nix interpolation, not shell expansion
          packages=$(nix eval --json .#packages.x86_64-linux --apply '
            pkgs:
            let
              candidates = builtins.filter
                (name: (pkgs.${name}.passthru.updateScript or null) != null)
                (builtins.attrNames pkgs);
              key = name:
                let pkg = pkgs.${name};
                in pkg.meta.position or (toString pkg.drvPath);
              entries = map (name: { inherit name; k = key name; }) candidates;
              dedup = acc: remaining:
                if remaining == [ ] then
                  acc
                else
                  let
                    entry = builtins.head remaining;
                    rest = builtins.tail remaining;
                  in
                  if builtins.any (existing: existing.k == entry.k) acc then
                    dedup acc rest
                  else
                    dedup (acc ++ [ entry ]) rest;
              names = map (entry: entry.name) (dedup [ ] entries);
            in
            builtins.sort (a: b: a < b) names
          ')

          if [ "$(jq 'length' <<<"$packages")" -eq 0 ]; then
            echo "no updatable packages found" >&2
            exit 1
          fi

          if [ -n "$REQUESTED" ]; then
            if ! jq -e --arg p "$REQUESTED" 'index($p)' <<<"$packages" >/dev/null; then
              echo "unknown updatable package: $REQUESTED" >&2
              echo "updatable packages: $(jq -r 'join(", ")' <<<"$packages")" >&2
              exit 1
            fi
            packages=$(jq -cn --arg p "$REQUESTED" '[$p]')
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  update:
    name: ${{ matrix.package }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    concurrency:
      group: update-package-${{ matrix.package }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # The repo's own Cachix cache, see docs/repository-structure.md.
      - name: Enable binary cache
        uses: cachix/cachix-action@v15
        with:
          name: 0xferrous
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Fork pull requests never receive the token, and their build results
          # must not enter a cache that this repo's machines substitute from.
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"

      - name: Set NIX_PATH
        # nix-update's --use-update-script runs the update script in a
        # `nix develop` shell built from `<nixpkgs>`; point that at this
        # flake's pinned nixpkgs instead of relying on channels.
        run: |
          nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./.)).inputs.nixpkgs.outPath')
          echo "NIX_PATH=nixpkgs=$nixpkgs" >> "$GITHUB_ENV"

      - name: Update ${{ matrix.package }}
        id: update
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          message_file="$RUNNER_TEMP/commit-message"
          body_file="$RUNNER_TEMP/pull-request-body"
          rm -f "$message_file" "$body_file"

          # The build is a separate step so a failure can be handed to the
          # repair agent; bumping the version and refreshing hashes happens
          # here, and only the version/asset part is trusted to nix-update.
          nix shell --inputs-from . nixpkgs#nix-update -c \
            nix-update --flake --use-update-script \
            --write-commit-message "$message_file" "$PACKAGE"

          if git diff --quiet; then
            echo "$PACKAGE is already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          first_line=$(sed -n '1p' "$message_file")
          subject="chore($PACKAGE): update ${first_line#*: }"
          details=$(sed -n '2,$p' "$message_file")

          printf 'Automated update of package %s.\n\n%s\n' "$PACKAGE" "$details" > "$body_file"

          {
            echo "changed=true"
            echo "subject=$subject"
            echo "message<<EOF"
            printf '%s\n%s\n' "$subject" "$details"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install repair agent
        if: steps.update.outputs.changed == 'true'
        # Same pinned opencode this machine uses, from llm-agents.nix; it is a
        # cache hit through cache.numtide.com (see NIX_CONFIG above).
        run: |
          agent=$(nix build --no-link --print-out-paths --impure --expr \
            '(builtins.getFlake (toString ./.)).inputs.llm-agents.packages.${builtins.currentSystem}.opencode')
          echo "$agent/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.package }}
        if: steps.update.outputs.changed == 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          PR_BODY_FILE: ${{ runner.temp }}/pull-request-body
          AUTOFIX_ATTEMPTS: ${{ inputs.autofix-attempts || '3' }}
          AUTOFIX_MODEL: ${{ vars.AUTOFIX_MODEL }}
          # Provider credentials for the repair agent. Configure whichever one
          # AUTOFIX_MODEL needs; without any of them the agent is skipped and a
          # broken bump fails the leg, as it did before.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: .github/scripts/build-or-autofix.sh "$PACKAGE"

      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: update/${{ matrix.package }}
          delete-branch: true
          add-paths: pkgs
          commit-message: ${{ steps.update.outputs.message }}
          title: ${{ steps.update.outputs.subject }}
          body-file: ${{ runner.temp }}/pull-request-body
