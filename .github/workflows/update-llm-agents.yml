name: update llm-agents

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-llm-agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Update llm-agents lock entry
        run: |
          nix flake update llm-agents

          if git diff --quiet -- flake.lock; then
            echo "llm-agents is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update llm-agents"
          git push origin HEAD:main
