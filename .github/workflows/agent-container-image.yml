name: agent container image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-container-image.yml"
      - "config/**"
      - "flake.lock"
      - "flake.nix"
      - "modules/nixos/**"
      - "patches/**"
      - "pkgs/**"
  pull_request:
    paths:
      - ".github/workflows/agent-container-image.yml"
      - "config/**"
      - "flake.lock"
      - "flake.nix"
      - "modules/nixos/**"
      - "patches/**"
      - "pkgs/**"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA, branch, or tag to build and publish"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: agent-container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            architecture: amd64
            runner: ubuntu-latest
          - system: aarch64-linux
            architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fr-agent

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # Configure Numtide before the daemon starts so target-native
          # llm-agents packages can substitute during the image build.
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false

      - name: Preview image build and cache plan
        run: |
          set -o pipefail
          target=".#packages.${{ matrix.system }}.agent-container-image"
          nix build --accept-flake-config --dry-run "$target" 2>&1 \
            | tee image-build-plan.txt

          derivations=$(grep -Ec '^  /nix/store/.*\.drv$' image-build-plan.txt || true)
          fetched=$(awk '
            /^these [0-9]+ paths will be fetched:$/ { in_paths = 1; next }
            in_paths && /^  / { count++; next }
            in_paths { in_paths = 0 }
            END { print count + 0 }
          ' image-build-plan.txt)
          eval_builds=$(grep -Ec "^building '/nix/store/.*\\.drv'" image-build-plan.txt || true)

          {
            echo "### Nix image build plan (${{ matrix.system }})"
            echo
            echo "- Derivations requiring a local build: $derivations"
            echo "- Evaluation-time derivations realized: $eval_builds"
            echo "- Paths fetched from substituters: $fetched"
            echo
            echo "Derivations not listed by 'nix build --dry-run' are available from the local store or configured substituters."
            echo
            echo '<details><summary>Planned derivations</summary>'
            echo
            echo '```text'
            grep -E '^these [0-9]+ (derivations will be built|paths will be fetched):$|^  /nix/store/.*\\.drv$' image-build-plan.txt || true
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build image archive
        run: |
          nix build --accept-flake-config --print-build-logs --print-out-paths \
            ".#packages.${{ matrix.system }}.agent-container-image" > image-path.txt
          gzip --decompress --stdout "$(cat image-path.txt)" > agent-container.tar

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          nix shell nixpkgs#crane -c \
            crane push agent-container.tar "${IMAGE_NAME}:${{ steps.source.outputs.sha }}-${{ matrix.architecture }}"

  publish-manifest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fr-agent

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image index
        run: |
          nix shell nixpkgs#crane -c crane index append \
            -m "${IMAGE_NAME}:${{ steps.source.outputs.sha }}-amd64" \
            -m "${IMAGE_NAME}:${{ steps.source.outputs.sha }}-arm64" \
            -t "${IMAGE_NAME}:${{ steps.source.outputs.sha }}"

          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            nix shell nixpkgs#crane -c crane index append \
              -m "${IMAGE_NAME}:${{ steps.source.outputs.sha }}-amd64" \
              -m "${IMAGE_NAME}:${{ steps.source.outputs.sha }}-arm64" \
              -t "${IMAGE_NAME}:latest"
          fi
