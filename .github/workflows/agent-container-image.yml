name: agent container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agent-container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fr-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Build image archive
        run: |
          image_path="$(nix build --accept-flake-config --print-out-paths .#agent-container-image)"
          gunzip --stdout "$image_path" > agent-container.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          nix shell nixpkgs#crane -c \
            crane push agent-container.tar "${IMAGE_NAME}:${GITHUB_SHA}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            nix shell nixpkgs#crane -c \
              crane push agent-container.tar "${IMAGE_NAME}:latest"
          fi
