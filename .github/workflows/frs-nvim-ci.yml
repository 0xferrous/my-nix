name: frs-nvim CI

on:
  push:
    paths:
      - ".github/workflows/frs-nvim-ci.yml"
      - "flake.nix"
      - "flake.lock"
      - "pkgs/frs-nvim/**"
  pull_request:
    paths:
      - ".github/workflows/frs-nvim-ci.yml"
      - "flake.nix"
      - "flake.lock"
      - "pkgs/frs-nvim/**"

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      # The repo's own Cachix cache, see docs/repository-structure.md.
      - name: Enable binary cache
        uses: cachix/cachix-action@v15
        with:
          name: 0xferrous
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Fork pull requests never receive the token, and their build results
          # must not enter a cache that this repo's machines substitute from.
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"

      - name: Run plugin smoke test
        run: nix run .#smoke

      - name: Run LSP smoke test
        run: nix run .#smoke-lsp

      - name: Run command smoke test
        run: nix run .#smoke-commands
