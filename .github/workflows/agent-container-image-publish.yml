name: publish agent container image

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA, branch, or tag whose built image should be published"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-agent-container-image-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fr-agent

    steps:
      - name: Resolve requested commit
        id: source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 1

      - name: Resolve source SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify built architecture images
        env:
          SOURCE_SHA: ${{ steps.sha.outputs.value }}
        run: |
          for architecture in amd64 arm64; do
            tag="${IMAGE_NAME}:${SOURCE_SHA}-${architecture}"
            if ! nix shell nixpkgs#crane -c crane manifest "$tag" >/dev/null; then
              echo "Missing ${tag}. Build and publish this commit first." >&2
              exit 1
            fi
          done

      - name: Publish multi-platform manifest
        env:
          SOURCE_SHA: ${{ steps.sha.outputs.value }}
        run: |
          nix shell nixpkgs#crane -c crane index append \
            -m "${IMAGE_NAME}:${SOURCE_SHA}-amd64" \
            -m "${IMAGE_NAME}:${SOURCE_SHA}-arm64" \
            -t "${IMAGE_NAME}:${SOURCE_SHA}"
