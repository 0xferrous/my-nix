name: microsandbox NixOS image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/microsandbox-nixos-image.yml"
      - "config/microsandbox/**"
  pull_request:
    paths:
      - ".github/workflows/microsandbox-nixos-image.yml"
      - "config/microsandbox/**"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA, branch, or tag to build and publish"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: microsandbox-nixos-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            architecture: amd64
            runner: ubuntu-latest
          - system: aarch64-linux
            architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/microsandbox-nixos

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false

      - name: Build image archive
        run: |
          nix build --accept-flake-config --print-build-logs --print-out-paths \
            "./config/microsandbox#packages.${{ matrix.system }}.image" > image-path.txt
          gzip --decompress --stdout "$(cat image-path.txt)" > microsandbox-nixos.tar

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          nix shell nixpkgs#crane -c \
            crane push microsandbox-nixos.tar \
            "${IMAGE_NAME}:${{ steps.source.outputs.sha }}-${{ matrix.architecture }}"

  publish-manifest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/microsandbox-nixos

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image index
        run: |
          nix shell nixpkgs#crane -c crane index append \
            -m "${IMAGE_NAME}:${{ steps.source.outputs.sha }}-amd64" \
            -m "${IMAGE_NAME}:${{ steps.source.outputs.sha }}-arm64" \
            -t "${IMAGE_NAME}:${{ steps.source.outputs.sha }}"

          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            nix shell nixpkgs#crane -c crane index append \
              -m "${IMAGE_NAME}:${{ steps.source.outputs.sha }}-amd64" \
              -m "${IMAGE_NAME}:${{ steps.source.outputs.sha }}-arm64" \
              -t "${IMAGE_NAME}:latest"
          fi
