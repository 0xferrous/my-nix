when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: microvm
image: nixos

# Let Spindle's Nix read proxy serve the same public caches used locally.
substituters:
  https://cache.nixos.org: "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="
  https://nix-community.cachix.org: "nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs="
  https://numtide.cachix.org: "numtide.cachix.org-1:2ps1kLBUWjxIneOy1Ik6cQjb41X0iXVXeHigGmycPPE="
  https://cache.numtide.com: "niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g="
  https://noctalia.cachix.org: "noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4="

steps:
  - name: "Build agent container image"
    command: |
      set -euo pipefail
      # The public microVM is memory-constrained; serialize Nix evaluation and
      # builds to avoid the guest kernel killing the nix process.
      nix build --accept-flake-config --max-jobs 1 --cores 1 \
        --print-out-paths .#agent-container-image
